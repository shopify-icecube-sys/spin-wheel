query CartInput {
  cart {
    lines {
      id
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          sku
          product {
            handle
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "wheelify", key: "percentage") {
      value
    }
  }
}